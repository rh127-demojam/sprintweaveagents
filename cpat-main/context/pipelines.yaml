# CPAT Custom Pipelines (RHOSO + OCP)
# Team-defined pipeline sequences. Managed via dashboard or chat commands.
# Commands: "Manage pipelines", "Create pipeline", "Restore default pipelines"
#
# Pipeline deliverables are ACTUAL FILES — source code, Excel workbooks,
# generator scripts. Agents MUST write working files to output/.
# RDA/ODA use multi-pass sub-stages: Schema → Generator → Workbooks (shell).
# RDE/ODE use multi-pass sub-stages: Ansible → Backend → Frontend → Docker → AAP.
#
# Schema sync: ODA-1 produces the MASTER ocp_ciq_schema.py at ciq-generators/.
# ODE-1 (Ansible) and ODE-2 (Backend) each carry a COPY adapted for their import paths.
# The ciq-generators/ standalone schema is the single source of truth.
# No CIQ generator exists in cpat/backend/ — generation is RDA/ODA only.
#
# AAP artifact ownership:
#   ODE-5 generates: import-via-api.sh (credential types, OCP JTs, OCP workflows, wiring)
#   RDE-5 generates: RHOSO section in import-via-api.sh (RHOSO JTs, RHOSO workflow, wiring)
#   cleanup-via-api.sh handles removal of all AAP objects

version: 2
custom:
  - id: rhoso-delivery
    name: "RHOSO Delivery"
    command: "Run RHOSO delivery pipeline on @cpat"
    promoted: true
    stages:
      - { abbrev: RDA-1, agent: "RHOSO DA",                  sub_stage: "Schema",    generates: ["output/ciq-generators/rhoso_ciq_schema.py"] }
      - { abbrev: RDA-2, agent: "RHOSO DA",                  sub_stage: "Generator", generates: ["output/ciq-generators/generate_rhoso_ciq_workbooks.py", "output/ciq-generators/requirements.txt"] }
      - { abbrev: RDA-3, agent: "RHOSO DA",                  sub_stage: "Workbooks", generates: ["output/ciq-workbooks/rhoso/"] }
      - { abbrev: RDE-1, agent: "RHOSO Deployment Engineer",  sub_stage: "Ansible",  generates: ["output/cpat/ansible/", "output/cpat/ansible.cfg"] }
      - { abbrev: RDE-2, agent: "RHOSO Deployment Engineer",  sub_stage: "Backend",  generates: ["output/cpat/backend/"] }
      - { abbrev: RDE-3, agent: "RHOSO Deployment Engineer",  sub_stage: "Frontend", generates: ["output/cpat/frontend/"] }
      - { abbrev: RDE-4, agent: "RHOSO Deployment Engineer",  sub_stage: "Docker",   generates: ["output/cpat/Dockerfile", "output/cpat/docker/", "output/cpat/bringup.sh", "output/cpat/USAGE.md"] }
      - { abbrev: RDE-5, agent: "RHOSO Deployment Engineer",  sub_stage: "AAP",      generates: ["output/cpat/aap/import-via-api.sh", "output/cpat/aap/cleanup-via-api.sh", "output/cpat/aap/README.md"] }
  - id: rhoso-da
    name: "RHOSO Design Architect"
    command: "Run RHOSO DA pipeline on @cpat"
    promoted: true
    stages:
      - { abbrev: RDA-1, agent: "RHOSO DA", sub_stage: "Schema",    generates: ["output/ciq-generators/rhoso_ciq_schema.py"] }
      - { abbrev: RDA-2, agent: "RHOSO DA", sub_stage: "Generator", generates: ["output/ciq-generators/generate_rhoso_ciq_workbooks.py", "output/ciq-generators/requirements.txt"] }
      - { abbrev: RDA-3, agent: "RHOSO DA", sub_stage: "Workbooks", generates: ["output/ciq-workbooks/rhoso/"] }
  - id: rhoso-de
    name: "RHOSO Deployment Engineer"
    command: "Run RHOSO DE pipeline on @cpat"
    promoted: true
    stages:
      - { abbrev: RDE-1, agent: "RHOSO Deployment Engineer", sub_stage: "Ansible",  generates: ["output/cpat/ansible/"] }
      - { abbrev: RDE-2, agent: "RHOSO Deployment Engineer", sub_stage: "Backend",  generates: ["output/cpat/backend/"] }
      - { abbrev: RDE-3, agent: "RHOSO Deployment Engineer", sub_stage: "Frontend", generates: ["output/cpat/frontend/"] }
      - { abbrev: RDE-4, agent: "RHOSO Deployment Engineer", sub_stage: "Docker",   generates: ["output/cpat/Dockerfile", "output/cpat/docker/", "output/cpat/bringup.sh"] }
      - { abbrev: RDE-5, agent: "RHOSO Deployment Engineer", sub_stage: "AAP",      generates: ["output/cpat/aap/import-via-api.sh", "output/cpat/aap/cleanup-via-api.sh", "output/cpat/aap/README.md"] }
  - id: ocp-delivery
    name: "OCP Delivery"
    command: "Run OCP delivery pipeline on @cpat"
    promoted: true
    stages:
      - { abbrev: ODA-1, agent: "OCP DA",                  sub_stage: "Schema",    generates: ["output/ciq-generators/ocp_ciq_schema.py"] }
      - { abbrev: ODA-2, agent: "OCP DA",                  sub_stage: "Generator", generates: ["output/ciq-generators/generate_ocp_ciq_workbooks.py", "output/ciq-generators/requirements.txt"] }
      - { abbrev: ODA-3, agent: "OCP DA",                  sub_stage: "Workbooks", generates: ["output/ciq-workbooks/ocp/"] }
      - { abbrev: ODE-1, agent: "OCP Deployment Engineer",  sub_stage: "Ansible",  generates: ["output/cpat/ansible/playbooks/roles/ocp/", "output/cpat/ansible/playbooks/roles/register/tasks/ocp.yml", "output/cpat/ansible/playbooks/ocp_install.yml", "output/cpat/ansible/playbooks/ocp_validate.yml", "output/cpat/ansible/library/parse_ciq.py", "output/cpat/ansible/module_utils/ocp_ciq_schema.py", "output/cpat/ansible/module_utils/ciq_parser.py"] }
      - { abbrev: ODE-2, agent: "OCP Deployment Engineer",  sub_stage: "Backend",  generates: ["output/cpat/backend/app.py", "output/cpat/backend/ansible_runner.py", "output/cpat/backend/ciq_parser.py", "output/cpat/backend/ocp_ciq_schema.py", "output/cpat/backend/models.py"] }
      - { abbrev: ODE-3, agent: "OCP Deployment Engineer",  sub_stage: "Frontend", generates: ["output/cpat/frontend/src/components/OcpInstallation.jsx", "output/cpat/frontend/src/components/OcpTaskProgress.jsx", "output/cpat/frontend/src/components/ExecutionTable.jsx", "output/cpat/frontend/src/components/InstallationLogModal.jsx", "output/cpat/frontend/src/api.js", "output/cpat/frontend/src/ocpInputFiles.js"] }
      - { abbrev: ODE-4, agent: "OCP Deployment Engineer",  sub_stage: "Docker",   generates: ["output/cpat/Dockerfile", "output/cpat/docker/", "output/cpat/bringup.sh", "output/cpat/USAGE.md", "output/cpat/binaries/README.md", "output/cpat/README-OCP.md"] }
      - { abbrev: ODE-5, agent: "OCP Deployment Engineer",  sub_stage: "AAP",      generates: ["output/cpat/aap/import-via-api.sh", "output/cpat/aap/cleanup-via-api.sh", "output/cpat/aap/README.md"] }
  - id: ocp-da
    name: "OCP Design Architect"
    command: "Run OCP DA pipeline on @cpat"
    promoted: true
    stages:
      - { abbrev: ODA-1, agent: "OCP DA", sub_stage: "Schema",    generates: ["output/ciq-generators/ocp_ciq_schema.py"] }
      - { abbrev: ODA-2, agent: "OCP DA", sub_stage: "Generator", generates: ["output/ciq-generators/generate_ocp_ciq_workbooks.py", "output/ciq-generators/requirements.txt"] }
      - { abbrev: ODA-3, agent: "OCP DA", sub_stage: "Workbooks", generates: ["output/ciq-workbooks/ocp/"] }
  - id: ocp-de
    name: "OCP Deployment Engineer"
    command: "Run OCP DE pipeline on @cpat"
    promoted: true
    stages:
      - { abbrev: ODE-1, agent: "OCP Deployment Engineer", sub_stage: "Ansible",  generates: ["output/cpat/ansible/playbooks/roles/ocp/", "output/cpat/ansible/playbooks/roles/register/tasks/ocp.yml", "output/cpat/ansible/playbooks/ocp_install.yml", "output/cpat/ansible/playbooks/ocp_validate.yml", "output/cpat/ansible/library/parse_ciq.py", "output/cpat/ansible/module_utils/ocp_ciq_schema.py", "output/cpat/ansible/module_utils/ciq_parser.py"] }
      - { abbrev: ODE-2, agent: "OCP Deployment Engineer", sub_stage: "Backend",  generates: ["output/cpat/backend/app.py", "output/cpat/backend/ansible_runner.py", "output/cpat/backend/ciq_parser.py", "output/cpat/backend/ocp_ciq_schema.py", "output/cpat/backend/models.py"] }
      - { abbrev: ODE-3, agent: "OCP Deployment Engineer", sub_stage: "Frontend", generates: ["output/cpat/frontend/src/components/OcpInstallation.jsx", "output/cpat/frontend/src/components/OcpTaskProgress.jsx", "output/cpat/frontend/src/components/ExecutionTable.jsx", "output/cpat/frontend/src/components/InstallationLogModal.jsx", "output/cpat/frontend/src/api.js", "output/cpat/frontend/src/ocpInputFiles.js"] }
      - { abbrev: ODE-4, agent: "OCP Deployment Engineer", sub_stage: "Docker",   generates: ["output/cpat/Dockerfile", "output/cpat/docker/", "output/cpat/bringup.sh", "output/cpat/binaries/README.md", "output/cpat/README-OCP.md"] }
      - { abbrev: ODE-5, agent: "OCP Deployment Engineer", sub_stage: "AAP",      generates: ["output/cpat/aap/import-via-api.sh", "output/cpat/aap/cleanup-via-api.sh", "output/cpat/aap/README.md"] }
  - id: full-delivery
    name: "Full Delivery (RHOSO + OCP)"
    command: "Run full delivery pipeline on @cpat"
    promoted: true
    stages:
      - { abbrev: RDA-1, agent: "RHOSO DA",                  sub_stage: "Schema",    generates: ["output/ciq-generators/rhoso_ciq_schema.py"] }
      - { abbrev: RDA-2, agent: "RHOSO DA",                  sub_stage: "Generator", generates: ["output/ciq-generators/generate_rhoso_ciq_workbooks.py", "output/ciq-generators/requirements.txt"] }
      - { abbrev: RDA-3, agent: "RHOSO DA",                  sub_stage: "Workbooks", generates: ["output/ciq-workbooks/rhoso/"] }
      - { abbrev: RDE-1, agent: "RHOSO Deployment Engineer",  sub_stage: "Ansible",  generates: ["output/cpat/ansible/playbooks/roles/rhoso/"] }
      - { abbrev: RDE-2, agent: "RHOSO Deployment Engineer",  sub_stage: "Backend",  generates: ["output/cpat/backend/"] }
      - { abbrev: RDE-3, agent: "RHOSO Deployment Engineer",  sub_stage: "Frontend", generates: ["output/cpat/frontend/"] }
      - { abbrev: RDE-4, agent: "RHOSO Deployment Engineer",  sub_stage: "Docker",   generates: ["output/cpat/Dockerfile", "output/cpat/docker/", "output/cpat/bringup.sh"] }
      - { abbrev: RDE-5, agent: "RHOSO Deployment Engineer",  sub_stage: "AAP",      generates: ["output/cpat/aap/import-via-api.sh", "output/cpat/aap/cleanup-via-api.sh", "output/cpat/aap/README.md"] }
      - { abbrev: ODA-1, agent: "OCP DA",                  sub_stage: "Schema",    generates: ["output/ciq-generators/ocp_ciq_schema.py"] }
      - { abbrev: ODA-2, agent: "OCP DA",                  sub_stage: "Generator", generates: ["output/ciq-generators/generate_ocp_ciq_workbooks.py"] }
      - { abbrev: ODA-3, agent: "OCP DA",                  sub_stage: "Workbooks", generates: ["output/ciq-workbooks/ocp/"] }
      - { abbrev: ODE-1, agent: "OCP Deployment Engineer",  sub_stage: "Ansible",  generates: ["output/cpat/ansible/playbooks/roles/ocp/", "output/cpat/ansible/playbooks/roles/register/tasks/ocp.yml", "output/cpat/ansible/playbooks/ocp_install.yml", "output/cpat/ansible/playbooks/ocp_validate.yml", "output/cpat/ansible/library/parse_ciq.py", "output/cpat/ansible/module_utils/ocp_ciq_schema.py", "output/cpat/ansible/module_utils/ciq_parser.py"] }
      - { abbrev: ODE-2, agent: "OCP Deployment Engineer",  sub_stage: "Backend",  generates: ["output/cpat/backend/app.py", "output/cpat/backend/ansible_runner.py", "output/cpat/backend/ciq_parser.py", "output/cpat/backend/ocp_ciq_schema.py", "output/cpat/backend/models.py"] }
      - { abbrev: ODE-3, agent: "OCP Deployment Engineer",  sub_stage: "Frontend", generates: ["output/cpat/frontend/src/components/OcpInstallation.jsx", "output/cpat/frontend/src/components/OcpTaskProgress.jsx", "output/cpat/frontend/src/components/ExecutionTable.jsx", "output/cpat/frontend/src/components/InstallationLogModal.jsx", "output/cpat/frontend/src/api.js", "output/cpat/frontend/src/ocpInputFiles.js"] }
      - { abbrev: ODE-4, agent: "OCP Deployment Engineer",  sub_stage: "Docker",   generates: ["output/cpat/Dockerfile", "output/cpat/docker/", "output/cpat/bringup.sh", "output/cpat/binaries/README.md", "output/cpat/README-OCP.md"] }
      - { abbrev: ODE-5, agent: "OCP Deployment Engineer",  sub_stage: "AAP",      generates: ["output/cpat/aap/import-via-api.sh", "output/cpat/aap/cleanup-via-api.sh", "output/cpat/aap/README.md"] }
deleted_builtin: []
