---
# OCP Installation Playbook — Generated by CPAT
#
# Usage:
#   ansible-playbook ocp_install.yml \
#     -e ocp_ciq_file=/path/to/ocp-ciq.xlsx \
#     -e ocp_task=<task_tag> \
#     [-e ocp_apply_manifests=true]
#
# Task tags:
#   full_install           - Full OCP installation (all steps)
#   generate_manifests     - Generate manifests only (no apply)
#   bastion_preparation    - Prepare bastion node
#   dns_dhcp_validation    - Validate DNS/DHCP records
#   ntp_sync               - Configure NTP/chrony
#   mirror_registry        - Deploy mirror registry (disconnected)
#   oc_mirror              - Execute oc-mirror (disconnected)
#   idms_itms_config       - Apply IDMS/CatalogSource (disconnected)
#   install_config         - Generate install-config.yaml
#   agent_config           - Generate agent-config.yaml (ABI)
#   nmstate_configs        - Generate NMState configs
#   ignition_configs       - Generate ignition configs (UPI)
#   agent_iso              - Create agent ISO (ABI)
#   bootstrap              - Bootstrap cluster
#   wait_install           - Wait for install to complete
#   approve_csrs           - Approve pending CSRs
#   auth_config            - Configure authentication
#   day2_operators         - Install day-2 operators
#   metallb_config         - Configure MetalLB
#   sriov_config           - Configure SR-IOV/Multus
#   health_check           - Cluster health check
#   node_readiness         - Node readiness check

- name: OCP Installation
  hosts: "{{ ocp_target_hosts | default('localhost') }}"
  connection: "{{ ocp_connection | default('local') }}"
  gather_facts: true

  roles:
    - role: ocp
      vars:
        ocp_selected_task: "{{ ocp_task | default('full_install') }}"
