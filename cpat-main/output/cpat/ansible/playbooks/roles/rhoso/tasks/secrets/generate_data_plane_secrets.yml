---
# Generate the 5 data plane Secret CRs required for RHOSO deployment.
# Reference: RHOSO 18.0 Install PDF — "Create data plane Secret CRs" (pp. 72-75)
#
# Secrets generated:
#   1. dataplane-ansible-ssh-private-key-secret (SSH key for Ansible)
#   2. nova-migration-ssh-key (SSH key for instance migration)
#   3. subscription-manager (Red Hat subscription credentials)
#   4. redhat-registry (container registry credentials)
#   5. libvirt-secret (libvirt password)

- name: DP Secrets — generate Ansible SSH key pair
  ansible.builtin.shell: |
    set -euo pipefail
    KEY_DIR="{{ rhoso_manifest_dir }}/.secrets"
    mkdir -p "${KEY_DIR}"
    if [[ ! -f "${KEY_DIR}/ansible-ssh-key" ]]; then
      ssh-keygen -f "${KEY_DIR}/ansible-ssh-key" -N "" -t rsa -b 4096 -q
      echo "generated"
    else
      echo "exists"
    fi
  args:
    executable: /bin/bash
  register: rhoso_dp_ansible_ssh_gen
  changed_when: "'generated' in rhoso_dp_ansible_ssh_gen.stdout"
  delegate_to: localhost

- name: DP Secrets — create Ansible SSH Secret CR
  ansible.builtin.shell: |
    set -euo pipefail
    KEY_DIR="{{ rhoso_manifest_dir }}/.secrets"
    oc create secret generic {{ rhoso_ansible_ssh_secret_name }} \
      --save-config \
      --dry-run=client \
      --from-file=ssh-privatekey="${KEY_DIR}/ansible-ssh-key" \
      --from-file=ssh-publickey="${KEY_DIR}/ansible-ssh-key.pub" \
      --from-file=authorized_keys="${KEY_DIR}/ansible-ssh-key.pub" \
      -n {{ rhoso_openstack_ns }} \
      -o yaml > "{{ rhoso_manifest_dir }}/secret-ansible-ssh.yaml"
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  delegate_to: localhost
  changed_when: true

- name: DP Secrets — apply Ansible SSH Secret
  ansible.builtin.shell: |
    set -euo pipefail
    oc apply -f "{{ rhoso_manifest_dir }}/secret-ansible-ssh.yaml" -n {{ rhoso_openstack_ns }}
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_dp_ssh_apply
  changed_when: "'created' in rhoso_dp_ssh_apply.stdout or 'configured' in rhoso_dp_ssh_apply.stdout"
  delegate_to: localhost
  when: rhoso_can_apply | bool

- name: DP Secrets — generate Nova migration SSH key pair
  ansible.builtin.shell: |
    set -euo pipefail
    KEY_DIR="{{ rhoso_manifest_dir }}/.secrets"
    if [[ ! -f "${KEY_DIR}/nova-migration-ssh-key" ]]; then
      ssh-keygen -f "${KEY_DIR}/nova-migration-ssh-key" -t ecdsa-sha2-nistp521 -N '' -q
      echo "generated"
    else
      echo "exists"
    fi
  args:
    executable: /bin/bash
  register: rhoso_dp_nova_ssh_gen
  changed_when: "'generated' in rhoso_dp_nova_ssh_gen.stdout"
  delegate_to: localhost

- name: DP Secrets — create Nova migration SSH Secret CR
  ansible.builtin.shell: |
    set -euo pipefail
    KEY_DIR="{{ rhoso_manifest_dir }}/.secrets"
    oc create secret generic {{ rhoso_nova_migration_secret_name }} \
      --save-config \
      --dry-run=client \
      --from-file=ssh-privatekey="${KEY_DIR}/nova-migration-ssh-key" \
      --from-file=ssh-publickey="${KEY_DIR}/nova-migration-ssh-key.pub" \
      -n {{ rhoso_openstack_ns }} \
      -o yaml > "{{ rhoso_manifest_dir }}/secret-nova-migration.yaml"
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  delegate_to: localhost
  changed_when: true

- name: DP Secrets — apply Nova migration SSH Secret
  ansible.builtin.shell: |
    set -euo pipefail
    oc apply -f "{{ rhoso_manifest_dir }}/secret-nova-migration.yaml" -n {{ rhoso_openstack_ns }}
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_dp_nova_apply
  changed_when: "'created' in rhoso_dp_nova_apply.stdout or 'configured' in rhoso_dp_nova_apply.stdout"
  delegate_to: localhost
  when: rhoso_can_apply | bool

- name: DP Secrets — create subscription-manager Secret CR
  ansible.builtin.shell: |
    set -euo pipefail
    if [[ "{{ rhoso_sub_method }}" == "activation_key" ]]; then
      oc create secret generic {{ rhoso_subscription_secret_name }} \
        --save-config --dry-run=client \
        --from-literal rhc_auth='{"login": {"activation_keys": [{"key": "{{ rhoso_rh_activation_key }}"}], "organization": "{{ rhoso_rh_org }}"}}' \
        -n {{ rhoso_openstack_ns }} \
        -o yaml > "{{ rhoso_manifest_dir }}/secret-subscription.yaml"
    else
      oc create secret generic {{ rhoso_subscription_secret_name }} \
        --save-config --dry-run=client \
        --from-literal rhc_auth='{"login": {"username": "{{ rhoso_rh_username }}", "password": "CHANGE_ME"}}' \
        -n {{ rhoso_openstack_ns }} \
        -o yaml > "{{ rhoso_manifest_dir }}/secret-subscription.yaml"
    fi
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  delegate_to: localhost
  changed_when: true
  no_log: true

- name: DP Secrets — apply subscription-manager Secret
  ansible.builtin.shell: |
    set -euo pipefail
    oc apply -f "{{ rhoso_manifest_dir }}/secret-subscription.yaml" -n {{ rhoso_openstack_ns }}
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_dp_sub_apply
  changed_when: "'created' in rhoso_dp_sub_apply.stdout or 'configured' in rhoso_dp_sub_apply.stdout"
  delegate_to: localhost
  when: rhoso_can_apply | bool

- name: DP Secrets — write libvirt Secret CR manifest
  ansible.builtin.copy:
    content: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ rhoso_libvirt_secret_name }}
        namespace: {{ rhoso_openstack_ns }}
      type: Opaque
      data:
        LibvirtPassword: {{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}
    dest: "{{ rhoso_manifest_dir }}/secret-libvirt.yaml"
    mode: "0600"
  delegate_to: localhost
  no_log: true

- name: DP Secrets — apply libvirt Secret
  ansible.builtin.shell: |
    set -euo pipefail
    oc apply -f "{{ rhoso_manifest_dir }}/secret-libvirt.yaml" -n {{ rhoso_openstack_ns }}
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_dp_libvirt_apply
  changed_when: "'created' in rhoso_dp_libvirt_apply.stdout or 'configured' in rhoso_dp_libvirt_apply.stdout"
  delegate_to: localhost
  when: rhoso_can_apply | bool

- name: DP Secrets — summary
  ansible.builtin.debug:
    msg:
      - "Data Plane Secrets generated:"
      - "  1. {{ rhoso_ansible_ssh_secret_name }} (Ansible SSH)"
      - "  2. {{ rhoso_nova_migration_secret_name }} (Nova migration SSH)"
      - "  3. {{ rhoso_subscription_secret_name }} (Subscription Manager)"
      - "  4. {{ rhoso_libvirt_secret_name }} (Libvirt)"
      - "Manifests written to: {{ rhoso_manifest_dir }}/secret-*.yaml"
      - "Applied: {{ rhoso_can_apply | bool }}"
