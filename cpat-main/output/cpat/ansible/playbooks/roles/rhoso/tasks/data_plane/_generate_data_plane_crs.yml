---
# Generate all Custom Resources required for RHOSO data-plane path.

- name: Data-plane CRs — require CIQ networks and management network
  ansible.builtin.assert:
    that:
      - rhoso_networks is defined
      - rhoso_networks | length > 0
      - rhoso_mgmt_net | length > 0
    fail_msg: >-
      Data-plane CR generation requires rhoso_networks rows and
      Management Network Name (or a network with Purpose=Control plane).

- name: Data-plane CRs — inventory of required CRDs vs generated CRs
  ansible.builtin.copy:
    dest: "{{ rhoso_manifest_dir }}/REQUIRED_CRDS_DATA_PLANE.md"
    mode: "0644"
    content: |
      # RHOSO Data Plane — required CRDs and generated CRs

      ## CRDs that must already exist (Operator-installed)
      {% for crd in rhoso_required_crds_data_plane %}
      - `{{ crd.name }}` → kind **{{ crd.kind }}** — {{ crd.purpose }}
      {% endfor %}
      {% if rhoso_dp_mode == 'unprovisioned' %}
      {% for crd in rhoso_required_crds_unprovisioned %}
      - `{{ crd.name }}` → kind **{{ crd.kind }}** — {{ crd.purpose }}
      {% endfor %}
      {% endif %}

      ## CRs generated by CPAT from CIQ
      | CR kind | File | Source CIQ |
      |---------|------|------------|
      | Secret (Ansible SSH) | applied live / key from CIQ | Data Plane SSH Private Key Path |
      | Secret (nova migration) | generated keypair | Nova Migration Secret Name |
      | Secret (subscription) | applied live | Org ID + Activation Key |
      | Secret (libvirt) | applied live | Libvirt Secret Name |
      | BareMetalHost + BMC Secret | openstack_baremetalhosts.yaml | rhoso_data_plane_nodes BMC* (unprovisioned) |
      | NMState Secret | openstack_nmstate_secrets.yaml | Provisioning NIC/VLAN/IP + DNS (unprovisioned) |
      | ConfigMap (Nova CPU) | openstack_nova_cpu_pinning_cm.yaml | EDPM CPU Dedicated Set (optional) |
      | OpenStackDataPlaneNodeSet | openstack_dataplane_nodeset.yaml | nodes + networks + SSH secret |
      | OpenStackDataPlaneDeployment | openstack_dataplane_deployment.yaml | Data Plane Deployment Name |

      NodeSet: {{ rhoso_nodeset_name }}
      Deployment: {{ rhoso_deployment_name }}
      Mode: {{ rhoso_dp_mode }}
  delegate_to: localhost

- name: Data-plane CRs — assert EDPM topology is CIQ-supported
  ansible.builtin.assert:
    that:
      - rhoso_edpm_net_topology in ['single_nic_vlans', 'dual_nic_bond', 'ovs_bond', 'linux_bond', 'ovs_dpdk']
    fail_msg: >-
      Unsupported EDPM Network Config Topology '{{ rhoso_edpm_net_topology }}'.
      Choose one of: single_nic_vlans, dual_nic_bond, ovs_bond, linux_bond, ovs_dpdk.
      CPAT generates the EDPM Jinja from CIQ parameters (no custom template upload).

- name: Data-plane CRs — generate EDPM network_config Jinja (for NodeSet + inspection)
  ansible.builtin.template:
    src: edpm_network_config_template.j2
    dest: "{{ rhoso_manifest_dir }}/edpm_network_config_template.j2"
    mode: "0644"
  delegate_to: localhost

- name: Data-plane CRs — generate BareMetalHost manifests (unprovisioned)
  ansible.builtin.template:
    src: openstack_baremetalhosts.yaml.j2
    dest: "{{ rhoso_manifest_dir }}/openstack_baremetalhosts.yaml"
    mode: "0644"
  delegate_to: localhost
  when: rhoso_dp_mode == 'unprovisioned'

- name: Data-plane CRs — generate NMState provisioning secrets (unprovisioned)
  ansible.builtin.template:
    src: openstack_nmstate_secrets.yaml.j2
    dest: "{{ rhoso_manifest_dir }}/openstack_nmstate_secrets.yaml"
    mode: "0644"
  delegate_to: localhost
  when: rhoso_dp_mode == 'unprovisioned'

- name: Data-plane CRs — generate Nova CPU-pinning ConfigMap
  ansible.builtin.template:
    src: openstack_nova_cpu_pinning_cm.yaml.j2
    dest: "{{ rhoso_manifest_dir }}/openstack_nova_cpu_pinning_cm.yaml"
    mode: "0644"
  delegate_to: localhost
  when: (rhoso_edpm_cpu_dedicated_set | default('') | string) | length > 0

- name: Data-plane CRs — generate OpenStackDataPlaneNodeSet
  ansible.builtin.template:
    src: openstack_dataplane_nodeset.yaml.j2
    dest: "{{ rhoso_manifest_dir }}/openstack_dataplane_nodeset.yaml"
    mode: "0644"
  delegate_to: localhost

- name: Data-plane CRs — generate OpenStackDataPlaneDeployment
  ansible.builtin.template:
    src: openstack_dataplane_deployment.yaml.j2
    dest: "{{ rhoso_manifest_dir }}/openstack_dataplane_deployment.yaml"
    mode: "0644"
  delegate_to: localhost

- name: Data-plane CRs — generation summary
  ansible.builtin.debug:
    msg:
      - "Generated data-plane related CRs in {{ rhoso_manifest_dir }}:"
      - "  - edpm_network_config_template.j2 (EDPM Jinja emitted into NodeSet ansibleVars)"
      - "  - openstack_dataplane_nodeset.yaml (OpenStackDataPlaneNodeSet)"
      - "  - openstack_dataplane_deployment.yaml (OpenStackDataPlaneDeployment)"
      - "  - openstack_baremetalhosts.yaml (BareMetalHost + BMC Secret, if unprovisioned)"
      - "  - openstack_nmstate_secrets.yaml (NMState provisioning secrets, if unprovisioned)"
      - "  - openstack_nova_cpu_pinning_cm.yaml (Nova CPU pinning ConfigMap, if CPU Dedicated Set set)"
      - "See REQUIRED_CRDS_DATA_PLANE.md for CRD checklist"
