---
# Generate the osp-secret Secret CR with auto-generated passwords for all 19 RHOSO services.
# Reference: RHOSO 18.0 Install PDF — "Provide secure access to services" (pp. 16-19)
#
# Generates base64-encoded random passwords and a Fernet key, writes the Secret
# YAML to the manifest directory, and optionally applies it to the cluster.

- name: OSP Secret — generate random service passwords
  ansible.builtin.set_fact:
    rhoso_osp_secret_passwords:
      AdminPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      AodhPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      BarbicanPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      CeilometerPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      CinderPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      DbRootPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      DesignatePassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      GlancePassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      HeatAuthEncryptionKey: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      HeatPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      IronicInspectorPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      IronicPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      ManilaPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      MetadataSecret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      NeutronPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      NovaPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      OctaviaHeartbeatKey: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      OctaviaPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      PlacementPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
      SwiftPassword: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
  delegate_to: localhost
  no_log: true

- name: OSP Secret — generate BarbicanSimpleCryptoKEK (Fernet key)
  ansible.builtin.shell: |
    set -euo pipefail
    python3 -c "
    from cryptography.fernet import Fernet
    import base64
    key = Fernet.generate_key().decode('UTF-8')
    print(base64.b64encode(key.encode()).decode())
    "
  args:
    executable: /bin/bash
  register: rhoso_fernet_key_result
  delegate_to: localhost
  changed_when: false
  no_log: true

- name: OSP Secret — write Secret CR to manifest directory
  ansible.builtin.copy:
    content: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ rhoso_osp_secret_name }}
        namespace: {{ rhoso_openstack_ns }}
      type: Opaque
      data:
      {% for key, value in rhoso_osp_secret_passwords.items() %}
        {{ key }}: {{ value }}
      {% endfor %}
        BarbicanSimpleCryptoKEK: {{ rhoso_fernet_key_result.stdout | trim }}
    dest: "{{ rhoso_manifest_dir }}/osp-secret.yaml"
    mode: "0600"
  delegate_to: localhost

- name: OSP Secret — apply to cluster
  ansible.builtin.shell: |
    set -euo pipefail
    oc apply -f "{{ rhoso_manifest_dir }}/osp-secret.yaml" -n {{ rhoso_openstack_ns }}
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_osp_secret_apply
  changed_when: "'created' in rhoso_osp_secret_apply.stdout or 'configured' in rhoso_osp_secret_apply.stdout"
  delegate_to: localhost
  when: rhoso_can_apply | bool

- name: OSP Secret — verify
  ansible.builtin.shell: |
    set -euo pipefail
    oc get secret {{ rhoso_osp_secret_name }} -n {{ rhoso_openstack_ns }} -o jsonpath='{.metadata.name}'
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  changed_when: false
  delegate_to: localhost
  when: rhoso_can_apply | bool

- name: OSP Secret — summary
  ansible.builtin.debug:
    msg:
      - "OSP Secret '{{ rhoso_osp_secret_name }}' generated with 20 service passwords + Fernet key"
      - "Manifest: {{ rhoso_manifest_dir }}/osp-secret.yaml"
      - "Applied: {{ rhoso_can_apply | bool }}"
