---
# Generate all Custom Resources required for RHOSO control-plane path.
# CRDs (schemas) come from Operators; these tasks emit CR instances from CIQ.

- name: Control-plane CRs — require rhoso_networks from CIQ
  ansible.builtin.assert:
    that:
      - rhoso_networks is defined
      - rhoso_networks | length > 0
      - rhoso_mgmt_net | length > 0
      - rhoso_internalapi_net | length > 0
      - rhoso_worker_iface | length > 0
    fail_msg: >-
      CIQ rhoso_networks must define at least one network, and rhoso_details must
      set Management Network Name, Internal API Network Name, and Worker NNCP Interface
      (or Purpose=Control plane / Internal API for auto-resolve of network names).

- name: Control-plane CRs — require network row fields used by templates
  ansible.builtin.assert:
    that:
      - item['Network Name'] | default('') | length > 0
      - item['CIDR'] | default('') | length > 0
      - item['DNS Domain'] | default('') | length > 0
      - item['Subnet Name'] | default('') | length > 0
      - item['NAD Type'] | default('') | length > 0
      - item['NAD Master Interface'] | default('') | length > 0
      - item['Whereabouts Start'] | default('') | length > 0
      - item['Whereabouts End'] | default('') | length > 0
    fail_msg: >-
      rhoso_networks row missing required fields (Network Name, CIDR, DNS Domain,
      Subnet Name, NAD Type, NAD Master Interface, Whereabouts Start/End): {{ item }}
  loop: "{{ rhoso_networks }}"
  loop_control:
    label: "{{ item['Network Name'] | default('unnamed') }}"

- name: Control-plane CRs — inventory of required CRDs vs generated CRs
  ansible.builtin.copy:
    dest: "{{ rhoso_manifest_dir }}/REQUIRED_CRDS_CONTROL_PLANE.md"
    mode: "0644"
    content: |
      # RHOSO Control Plane — required CRDs and generated CRs

      ## CRDs that must already exist (Operator-installed)
      {% for crd in rhoso_required_crds_control_plane %}
      - `{{ crd.name }}` → kind **{{ crd.kind }}** — {{ crd.purpose }}
      {% endfor %}

      ## CRs generated by CPAT from CIQ
      | CR kind | File | Source CIQ |
      |---------|------|------------|
      | NodeNetworkConfigurationPolicy | openstack_nncp.yaml | rhoso_networks + Worker NNCP Interface |
      | NetworkAttachmentDefinition | openstack_nad.yaml | rhoso_networks (CIDR, Whereabouts*, NAD*) |
      | IPAddressPool / L2Advertisement | openstack_metallb.yaml | rhoso_networks MetalLB Start/End |
      | NetConfig | openstack_netconfig.yaml | rhoso_networks Allocation*/CIDR/VLAN |
      | OpenStackControlPlane | openstack_control_plane.yaml | rhoso_details (storage, VIPs, secret) |
      | Secret (osp-secret) | created by RHOCP Preparation task | OSP Secret Name |

      Namespace: {{ rhoso_openstack_ns }}
      ControlPlane name: {{ rhoso_control_plane_name }}
  delegate_to: localhost

- name: Control-plane CRs — discover worker node names for NNCP
  ansible.builtin.command:
    cmd: >-
      oc get nodes -l node-role.kubernetes.io/worker
      -o jsonpath={.items[*].metadata.name}
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_worker_query
  changed_when: false
  failed_when: false
  delegate_to: localhost
  when: rhoso_can_query | bool

- name: Control-plane CRs — set worker list fact
  ansible.builtin.set_fact:
    rhoso_worker_nodes: >-
      {{
        (rhoso_worker_query.stdout.split() if (rhoso_worker_query.stdout | default('') | string) | length > 0 else [])
        if (rhoso_can_query | bool) else []
      }}

- name: Control-plane CRs — require discovered workers when applying (not generate-only)
  ansible.builtin.assert:
    that:
      - rhoso_worker_nodes | length > 0
    fail_msg: >-
      No worker nodes found (label node-role.kubernetes.io/worker).
      Cannot apply NodeNetworkConfigurationPolicy without worker names.
  when: rhoso_can_apply | bool

- name: Control-plane CRs — warn when generating NNCP without worker discovery
  ansible.builtin.debug:
    msg: >-
      Generating NNCP with empty/partial worker list for review
      (kubeconfig missing, unreachable, or no workers labeled).
      Re-run Generate with a valid Kubeconfig Path for accurate node names,
      or edit openstack_nncp.yaml before Deploy.
  when:
    - not (rhoso_can_apply | bool)
    - (rhoso_worker_nodes | default([]) | length) == 0

- name: Control-plane CRs — generate NodeNetworkConfigurationPolicy
  ansible.builtin.template:
    src: openstack_nncp.yaml.j2
    dest: "{{ rhoso_manifest_dir }}/openstack_nncp.yaml"
    mode: "0644"
  delegate_to: localhost

- name: Control-plane CRs — generate NetworkAttachmentDefinition set
  ansible.builtin.template:
    src: openstack_nad.yaml.j2
    dest: "{{ rhoso_manifest_dir }}/openstack_nad.yaml"
    mode: "0644"
  delegate_to: localhost

- name: Control-plane CRs — generate MetalLB IPAddressPool + L2Advertisement
  ansible.builtin.template:
    src: openstack_metallb.yaml.j2
    dest: "{{ rhoso_manifest_dir }}/openstack_metallb.yaml"
    mode: "0644"
  delegate_to: localhost

- name: Control-plane CRs — generate NetConfig
  ansible.builtin.template:
    src: openstack_netconfig.yaml.j2
    dest: "{{ rhoso_manifest_dir }}/openstack_netconfig.yaml"
    mode: "0644"
  delegate_to: localhost

- name: Control-plane CRs — generate OpenStackControlPlane
  ansible.builtin.template:
    src: openstack_control_plane.yaml.j2
    dest: "{{ rhoso_manifest_dir }}/openstack_control_plane.yaml"
    mode: "0644"
  delegate_to: localhost

- name: Control-plane CRs — generation summary
  ansible.builtin.debug:
    msg:
      - "Generated control-plane related CRs in {{ rhoso_manifest_dir }}:"
      - "  - openstack_nncp.yaml (NodeNetworkConfigurationPolicy)"
      - "  - openstack_nad.yaml (NetworkAttachmentDefinition)"
      - "  - openstack_metallb.yaml (IPAddressPool + L2Advertisement)"
      - "  - openstack_netconfig.yaml (NetConfig)"
      - "  - openstack_control_plane.yaml (OpenStackControlPlane)"
      - "See REQUIRED_CRDS_CONTROL_PLANE.md for CRD checklist"
