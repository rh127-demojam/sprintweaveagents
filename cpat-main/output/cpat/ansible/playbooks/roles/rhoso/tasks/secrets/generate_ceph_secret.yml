---
# Generate the Ceph configuration Secret CR (ceph-conf-files) for RHOSO deployment.
# Reference: RHOSO 18.0 Install PDF — "Integrating Ceph Storage"
#
# This secret provides /etc/ceph/<cluster>.conf and keyring to:
#   - Glance (RBD image storage)
#   - Cinder (RBD volume storage)
#   - Nova (RBD ephemeral disks)
#   - Swift proxy (when RGW is enabled)
#
# Required CIQ parameters:
#   - Ceph External = yes
#   - Ceph Cluster Name, FSID, Mon Host, Client Name, Client Key Path

- name: Ceph Secret — skip when Ceph External is not enabled
  ansible.builtin.debug:
    msg: "Ceph External is not enabled — skipping ceph-conf-files Secret generation."
  when: not (rhoso_ceph_external | bool)

- name: Ceph Secret — validate required parameters
  ansible.builtin.assert:
    that:
      - rhoso_ceph_fsid | length > 0
      - rhoso_ceph_mon_host | length > 0
      - rhoso_ceph_client_name | length > 0
      - rhoso_ceph_client_key_path | length > 0
    fail_msg: >-
      Ceph External is enabled but required parameters are missing.
      Ensure Ceph FSID, Ceph Mon Host, Ceph Client Name, and
      Ceph Client Key Path are all set in the CIQ.
  when: rhoso_ceph_external | bool

- name: Ceph Secret — read Ceph client keyring
  ansible.builtin.slurp:
    src: "{{ rhoso_ceph_client_key_path }}"
  register: rhoso_ceph_keyring_raw
  delegate_to: localhost
  when: rhoso_ceph_external | bool

- name: Ceph Secret — generate ceph.conf content
  ansible.builtin.set_fact:
    rhoso_ceph_conf_content: |
      [global]
      fsid = {{ rhoso_ceph_fsid }}
      mon_host = {{ rhoso_ceph_mon_host }}
  when: rhoso_ceph_external | bool

- name: Ceph Secret — generate ceph-conf-files Secret manifest
  ansible.builtin.template:
    src: /dev/stdin
    dest: "{{ rhoso_manifest_dir }}/secret-ceph-conf-files.yaml"
    mode: "0600"
  args:
    _raw_params: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: ceph-conf-files
        namespace: {{ rhoso_openstack_ns }}
      type: Opaque
      data:
        {{ rhoso_ceph_cluster_name }}.conf: {{ rhoso_ceph_conf_content | b64encode }}
        {{ rhoso_ceph_cluster_name }}.client.{{ rhoso_ceph_client_name }}.keyring: {{ rhoso_ceph_keyring_raw.content }}
  delegate_to: localhost
  no_log: true
  when: rhoso_ceph_external | bool

- name: Ceph Secret — apply ceph-conf-files Secret
  ansible.builtin.shell: |
    set -euo pipefail
    oc apply -f "{{ rhoso_manifest_dir }}/secret-ceph-conf-files.yaml" -n {{ rhoso_openstack_ns }}
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_ceph_secret_apply
  changed_when: "'created' in rhoso_ceph_secret_apply.stdout or 'configured' in rhoso_ceph_secret_apply.stdout"
  delegate_to: localhost
  when:
    - rhoso_ceph_external | bool
    - rhoso_can_apply | bool

- name: Ceph Secret — summary
  ansible.builtin.debug:
    msg:
      - "Ceph Secret generation {{ rhoso_ceph_external | bool | ternary('complete', 'skipped (Ceph External = no)') }}"
      - "  Secret: ceph-conf-files"
      - "  Cluster: {{ rhoso_ceph_cluster_name }}"
      - "  FSID: {{ rhoso_ceph_fsid }}"
      - "  Mon Host: {{ rhoso_ceph_mon_host }}"
      - "  Client: {{ rhoso_ceph_client_name }}"
      - "  Manifest: {{ rhoso_manifest_dir }}/secret-ceph-conf-files.yaml"
  when: rhoso_ceph_external | bool
