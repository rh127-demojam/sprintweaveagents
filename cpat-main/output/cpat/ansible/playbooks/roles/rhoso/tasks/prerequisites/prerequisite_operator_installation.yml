---
# Deploying RHOSO 18.0 — Pre-requisite Operator Installation
# Installs NMState, MetalLB, and Cert-Manager Operators via OLM Subscriptions.
# Reference: RHOSO 18.0 "Planning your deployment" & "Deploying Ch.1 prerequisites"
#
# Each operator follows the pattern:
#   1) Create Namespace (if not default)
#   2) Create OperatorGroup
#   3) Create Subscription (channel, source, approval)
#   4) Approve InstallPlan (Manual approval)
#   5) Wait for CSV Succeeded

- name: Prerequisite Operators — document steps
  ansible.builtin.debug:
    msg:
      - "Prerequisite Operator Installation (NMState, MetalLB, Cert-Manager)"
      - "Reference: RHOSO 18.0 Planning + Deploying prerequisites"
      - "Mode: {{ rhoso_deployment_mode }}"
      - "Operator source: {{ rhoso_prereq_operator_source }}"
      - "Install plan approval: {{ rhoso_prereq_install_plan_approval }}"

# ---------------------------------------------------------------------------
# NMState Operator
# ---------------------------------------------------------------------------

- name: NMState Operator — create Namespace
  ansible.builtin.shell: |
    set -euo pipefail
    oc apply -f - <<EOF
    apiVersion: v1
    kind: Namespace
    metadata:
      labels:
        kubernetes.io/metadata.name: {{ rhoso_nmstate_namespace }}
        name: {{ rhoso_nmstate_namespace }}
      name: {{ rhoso_nmstate_namespace }}
    spec:
      finalizers:
      - kubernetes
    EOF
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_nmstate_ns
  changed_when: "'created' in rhoso_nmstate_ns.stdout or 'configured' in rhoso_nmstate_ns.stdout"
  delegate_to: localhost
  when: rhoso_can_apply | bool

- name: NMState Operator — create OperatorGroup
  ansible.builtin.shell: |
    set -euo pipefail
    oc apply -f - <<EOF
    apiVersion: operators.coreos.com/v1
    kind: OperatorGroup
    metadata:
      annotations:
        olm.providedAPIs: NMState.v1.nmstate.io
      name: openshift-nmstate
      namespace: {{ rhoso_nmstate_namespace }}
    spec:
      targetNamespaces:
      - {{ rhoso_nmstate_namespace }}
    EOF
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_nmstate_og
  changed_when: "'created' in rhoso_nmstate_og.stdout or 'configured' in rhoso_nmstate_og.stdout"
  delegate_to: localhost
  when: rhoso_can_apply | bool

- name: NMState Operator — create Subscription
  ansible.builtin.shell: |
    set -euo pipefail
    oc apply -f - <<EOF
    apiVersion: operators.coreos.com/v1alpha1
    kind: Subscription
    metadata:
      labels:
        operators.coreos.com/kubernetes-nmstate-operator.openshift-nmstate: ""
      name: kubernetes-nmstate-operator
      namespace: {{ rhoso_nmstate_namespace }}
    spec:
      channel: {{ rhoso_nmstate_channel }}
      installPlanApproval: {{ rhoso_prereq_install_plan_approval }}
      name: kubernetes-nmstate-operator
      source: {{ rhoso_prereq_operator_source }}
      sourceNamespace: {{ rhoso_prereq_operator_source_ns }}
    EOF
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_nmstate_sub
  changed_when: "'created' in rhoso_nmstate_sub.stdout or 'configured' in rhoso_nmstate_sub.stdout"
  delegate_to: localhost
  when: rhoso_can_apply | bool

- name: NMState Operator — approve InstallPlan
  ansible.builtin.shell: |
    set -euo pipefail
    for i in $(seq 1 60); do
      plan=$(oc get installplan -n {{ rhoso_nmstate_namespace }} -o json \
        | jq -r '.items[] | select(.spec.approval=="Manual" and .spec.approved==false) | .metadata.name' \
        | head -n1)
      if [[ -n "${plan}" && "${plan}" != "null" ]]; then
        echo "Approving InstallPlan ${plan}"
        oc patch installplan "${plan}" -n {{ rhoso_nmstate_namespace }} \
          --type merge -p '{"approved":true}'
        exit 0
      fi
      sleep 10
    done
    echo "No pending Manual InstallPlan found (may already be approved)"
    exit 0
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  changed_when: false
  delegate_to: localhost
  when:
    - rhoso_can_apply | bool
    - rhoso_prereq_install_plan_approval == "Manual"

- name: NMState Operator — wait for CSV Succeeded
  ansible.builtin.shell: |
    set -euo pipefail
    end=$((SECONDS+600))
    while (( SECONDS < end )); do
      phase=$(oc get csv -n {{ rhoso_nmstate_namespace }} \
        -o jsonpath='{.items[?(@.spec.displayName=="Kubernetes NMState Operator")].status.phase}' 2>/dev/null || true)
      echo "NMState Operator CSV phase=${phase}"
      if [[ "${phase}" == "Succeeded" ]]; then
        exit 0
      fi
      sleep 15
    done
    oc get csv -n {{ rhoso_nmstate_namespace }} || true
    exit 1
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  changed_when: false
  delegate_to: localhost
  when: rhoso_can_apply | bool

- name: NMState Operator — create NMState instance
  ansible.builtin.shell: |
    set -euo pipefail
    oc apply -f - <<EOF
    apiVersion: nmstate.io/v1
    kind: NMState
    metadata:
      name: nmstate
    EOF
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_nmstate_cr
  changed_when: "'created' in rhoso_nmstate_cr.stdout or 'configured' in rhoso_nmstate_cr.stdout"
  delegate_to: localhost
  when: rhoso_can_apply | bool

