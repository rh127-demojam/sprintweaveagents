# Reference: RHOSO 18.0 Plan PDF — "HA Operators for automated failover"
# ---------------------------------------------------------------------------

- name: Node Health Check Operator — create Subscription
  ansible.builtin.shell: |
    set -euo pipefail
    oc apply -f - <<EOF
    apiVersion: operators.coreos.com/v1alpha1
    kind: Subscription
    metadata:
      name: node-healthcheck-operator
      namespace: openshift-operators
    spec:
      name: node-healthcheck-operator
      channel: stable
      source: {{ rhoso_prereq_operator_source }}
      sourceNamespace: {{ rhoso_prereq_operator_source_ns }}
      installPlanApproval: {{ rhoso_prereq_install_plan_approval }}
    EOF
  args:
    executable: /bin/bash
  environment: "{{ rhoso_oc_env }}"
  register: rhoso_nhc_sub
  changed_when: "'created' in rhoso_nhc_sub.stdout or 'configured' in rhoso_nhc_sub.stdout"
  delegate_to: localhost
  when:
    - rhoso_can_apply | bool
    - rhoso_node_health_check_enabled | bool

- name: Node Health Check Operator — wait for CSV Succeeded
  ansible.builtin.shell: |
    set -euo pipefail
    end=$((SECONDS+600))
