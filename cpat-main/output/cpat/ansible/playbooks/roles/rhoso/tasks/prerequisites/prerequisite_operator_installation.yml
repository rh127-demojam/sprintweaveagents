# ---------------------------------------------------------------------------
# Summary
# ---------------------------------------------------------------------------

- name: Prerequisite Operators — verify all CRDs present
  ansible.builtin.include_tasks: common/_verify_required_crds.yml
  vars:
    rhoso_crd_check_list: "{{ rhoso_required_crds_prerequisites }}"

- name: Prerequisite Operators — summary
  ansible.builtin.debug:
    msg:
      - "Prerequisite Operator Installation Complete"
