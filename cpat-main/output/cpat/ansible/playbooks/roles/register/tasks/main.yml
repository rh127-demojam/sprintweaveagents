---
- name: Parse CIQ workbook for target cluster type
  parse_ciq:
    path: "{{ ciq_file_path }}"
    cluster_type: "{{ registration_target }}"
  register: ciq
  tags: register

- name: Show parsed cluster summary
  ansible.builtin.debug:
    msg:
      cluster_name: "{{ ciq.cluster_name }}"
      cluster_type: "{{ ciq.cluster_type }}"
      cluster_type_label: "{{ ciq.cluster_type_label }}"
      type_raw_value: "{{ ciq.type_raw_value }}"
      source_table: "{{ ciq.source_table }}"
      source_sheet: "{{ ciq.source_sheet }}"
  tags: register

- name: Run cluster-type specific registration
  ansible.builtin.include_tasks: "{{ registration_target }}.yml"
  tags: register
