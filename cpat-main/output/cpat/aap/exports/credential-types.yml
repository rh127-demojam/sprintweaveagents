# ---------------------------------------------------------------------------
# CPAT Custom Credential Types for AAP 2.5
# Import: awx-manage import < credential-types.yml
# ---------------------------------------------------------------------------
---
credential_types:

  # -------------------------------------------------------------------------
  # 1. Bastion SSH — SSH access to bastion host for delegate_to tasks
  # -------------------------------------------------------------------------
  - name: "CPAT Bastion SSH"
    description: >-
      SSH credentials for the OCP/RHOSO bastion host. Used by Ansible
      delegate_to tasks that run commands on the bastion (HAProxy setup,
      openshift-install, oc-mirror, etc.).
    kind: cloud
    inputs:
      fields:
        - id: bastion_ssh_user
          type: string
          label: "Bastion SSH Username"
          help_text: "SSH username for bastion host (e.g. cloud-user, root)"
        - id: bastion_ssh_key
          type: string
          label: "Bastion SSH Private Key"
          format: ssh_private_key
          secret: true
          multiline: true
          help_text: "Private SSH key for bastion access (PEM format)"
      required:
        - bastion_ssh_user
        - bastion_ssh_key
    injectors:
      file:
        template.bastion_key: "{{ bastion_ssh_key }}"
      extra_vars:
        ocp_bastion_ssh_user: "{{ bastion_ssh_user }}"
        ocp_bastion_ssh_key_path: "{{ tower.filename.bastion_key }}"

  # -------------------------------------------------------------------------
  # 2. BMC Credentials — Redfish API auth for bare-metal / virtual BMC
  # -------------------------------------------------------------------------
  - name: "CPAT BMC Credentials"
    description: >-
      Username and password for Redfish BMC API access. Used by boot_nodes,
      bootstrap media-eject, and destroy_cluster tasks. Applies to both
      physical iLO/iDRAC/BMC and virtual sushy-tools endpoints.
    kind: cloud
    inputs:
      fields:
        - id: bmc_user
          type: string
          label: "BMC Username"
          help_text: "Redfish API username (e.g. admin, Administrator)"
        - id: bmc_password
          type: string
          label: "BMC Password"
          secret: true
          help_text: "Redfish API password"
      required:
        - bmc_user
        - bmc_password
    injectors:
      extra_vars:
        ocp_bmc_user: "{{ bmc_user }}"
        ocp_bmc_password: "{{ bmc_password }}"

  # -------------------------------------------------------------------------
  # 3. Pull Secret — OpenShift pull secret (JSON file content)
  # -------------------------------------------------------------------------
  - name: "CPAT Pull Secret"
    description: >-
      OpenShift pull secret (JSON). Injected as a temporary file on the
      Ansible controller; path passed via extra var. Never logged.
    kind: cloud
    inputs:
      fields:
        - id: pull_secret_content
          type: string
          label: "Pull Secret (JSON)"
          secret: true
          multiline: true
          help_text: >-
            Paste the full JSON content of your pull secret from
            console.redhat.com/openshift/install/pull-secret
      required:
        - pull_secret_content
    injectors:
      file:
        template.pull_secret: "{{ pull_secret_content }}"
      extra_vars:
        ocp_pull_secret_path: "{{ tower.filename.pull_secret }}"
