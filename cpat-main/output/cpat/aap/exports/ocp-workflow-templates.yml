  # =========================================================================
  # 3. OCP Destroy Cluster
  # =========================================================================
  - name: "CPAT OCP Destroy"
    description: >-
      Destroy an OCP cluster: eject media, power off nodes, stop HAProxy,
      remove VIPs, clean artifacts.
    organization: "Default"
    ask_variables_on_launch: true
    survey_enabled: true
    survey_spec:
      name: "OCP Destroy Parameters"
      description: "Cluster to destroy"
      spec:
        - question_name: "CIQ File Path"
          variable: "ocp_ciq_file"
          type: "text"
          required: true
          default: ""
        - question_name: "Cluster Name"
          variable: "ocp_cluster_name"
          type: "text"
          required: true
          default: ""
        - question_name: "OCP Version"
          variable: "ocp_version"
          type: "multiplechoice"
          required: true
          default: "4.20"
          choices: ["4.17", "4.18", "4.19", "4.20", "4.22"]
    workflow_nodes:
      - identifier: destroy_cluster
        unified_job_template: { name: "CPAT OCP Install", type: job_template }
        extra_data: { ocp_task: "destroy_cluster", ocp_apply_manifests: true, ocp_skip_generation: true }
