      - { identifier: rhocp_prep, unified_job_template: { name: "CPAT RHOSO Install", type: job_template }, extra_data: { installation_task: "control_plane/rhocp_preparation_for_rhoso", rhoso_apply_manifests: true, rhoso_skip_generation: true }, success_nodes: [{ identifier: control_plane_deploy }] }
