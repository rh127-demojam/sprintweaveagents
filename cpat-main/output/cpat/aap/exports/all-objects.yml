      - { identifier: control_plane_custom, unified_job_template: { name: "CPAT RHOSO Install", type: job_template }, extra_data: { installation_task: "control_plane/control_plane_customization", rhoso_apply_manifests: true, rhoso_skip_generation: true }, success_nodes: [{ identifier: network_prep }] }
      - { identifier: network_prep, unified_job_template: { name: "CPAT RHOSO Install", type: job_template }, extra_data: { installation_task: "network/network_preparation", rhoso_apply_manifests: true, rhoso_skip_generation: true }, success_nodes: [{ identifier: data_plane_deploy }] }
      - { identifier: data_plane_deploy, unified_job_template: { name: "CPAT RHOSO Install", type: job_template }, extra_data: { installation_task: "data_plane/data_plane_deployment_and_verification", rhoso_apply_manifests: true, rhoso_skip_generation: true }, success_nodes: [{ identifier: post_validation }] }
      - { identifier: post_validation, unified_job_template: { name: "CPAT RHOSO Install", type: job_template }, extra_data: { installation_task: "post_deployment/post_deployment_validation", rhoso_apply_manifests: true, rhoso_skip_generation: true }, success_nodes: [{ identifier: observability }] }
      - { identifier: observability, unified_job_template: { name: "CPAT RHOSO Install", type: job_template }, extra_data: { installation_task: "post_deployment/observability_configuration", rhoso_apply_manifests: true, rhoso_skip_generation: true } }
