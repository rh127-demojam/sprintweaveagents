      - { identifier: trident_storage, unified_job_template: { name: "CPAT RHOSO Install", type: job_template }, extra_data: { installation_task: "storage/trident_storage_configuration", rhoso_apply_manifests: true, rhoso_skip_generation: true }, success_nodes: [{ identifier: storage_crs }] }
      - { identifier: storage_crs, unified_job_template: { name: "CPAT RHOSO Install", type: job_template }, extra_data: { installation_task: "storage/_generate_storage_crs", rhoso_apply_manifests: true, rhoso_skip_generation: true }, success_nodes: [{ identifier: openstack_operator }] }
