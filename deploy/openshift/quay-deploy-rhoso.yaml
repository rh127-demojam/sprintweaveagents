# Image: quay.io/YOUR_ORG/sprintweave-rhoso:latest (ZIP / cpat-main as sprintweave-agents)
#   oc new-project sprintweave-rhoso
#   oc apply -f this file (replace YOUR_ORG)

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sprintweave-data
  namespace: sprintweave
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sprintweave-config
  namespace: sprintweave
data:
  LLM_PROVIDER: "openai"
  LLM_BASE_URL: "https://maas-rhdp.apps.maas.redhatworkshops.io/v1"
  LLM_MODEL: "claude-opus-4-6"
  LLM_MAX_TOKENS: "32768"
  LLM_TIMEOUT: "600"
  SPRINTWEAVE_USE_DOCLING: "true"
  SPRINTWEAVE_DOCLING_OCR: "false"
  SPRINTWEAVE_DOCLING_TABLES: "false"
  SPRINTWEAVE_DOCLING_MD_CACHE: "true"
  SPRINTWEAVE_REQUIRE_PARSED: "true"
  HF_HOME: "/opt/docling-cache"
  DOCLING_CACHE_DIR: "/opt/docling-cache"
  HUGGINGFACE_HUB_CACHE: "/opt/docling-cache/hub"
  SPRINTWEAVE_AGENT_MAX_STEPS: "60"
  SPRINTWEAVE_ANSIBLE_ROUND_STEPS: "25"
  SPRINTWEAVE_ANSIBLE_MAX_ROUNDS: "12"
  SPRINTWEAVE_AGENT_PYTHON_TIMEOUT: "300"
  SPRINTWEAVE_AGENT_COMPACT: "true"
  SPRINTWEAVE_AGENT_COMPACT_KEEP_TURNS: "3"
  SPRINTWEAVE_AGENT_TOOL_RESULT_MAX: "40000"
  SPRINTWEAVE_AGENT_PYTHON_INLINE: "false"
  SPRINTWEAVE_AGENT_FORCE_WRITE_AFTER_STEP: "3"
  SPRINTWEAVE_TEXT_MAX: "60000"
  SPRINTWEAVE_SKILL_PROMPT_MAX: "0"
  SPRINTWEAVE_AGENT_PROMPT_MAX: "12000"
  SPRINTWEAVE_LAB_SINGLE_SHOT: "true"
  SPRINTWEAVE_RDA_SINGLE_SHOT: "true"
  SPRINTWEAVE_RDE_SINGLE_SHOT: "true"
  SPRINTWEAVE_PIPELINES: "lab-requirements,rhoso"
  # CPAT one-click deploy: openshift | bringup | manifests (empty = auto)
  SPRINTWEAVE_CPAT_DEPLOY_MODE: "openshift"
  SPRINTWEAVE_CPAT_NAMESPACE: "sprintweave"
  # LangGraph: ansible=tool-loop, rde=Backend/Frontend/Docker one-shot, custom=both.
  # Comma list or "all". false = legacy only.
  SPRINTWEAVE_USE_LANGGRAPH: "true"
  SPRINTWEAVE_LANGGRAPH_SCOPE: "ansible,custom,rde"
  # Tool-loop uses llm.client.complete_tools SSE keep-alive (recommended).
  SPRINTWEAVE_LANGGRAPH_KEEPALIVE: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprintweave-api
  namespace: sprintweave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sprintweave-api
  template:
    metadata:
      labels:
        app: sprintweave-api
    spec:
      containers:
        - name: api
          image: quay.io/YOUR_ORG/sprintweave-rhoso:latest
          imagePullPolicy: Always
          workingDir: /app/sprintweave-web
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOME
              value: /app
            - name: PYTHONPATH
              value: /app/sprintweave-web:/app
            - name: SPRINTWEAVE_DATA_DIR
              value: /data
            - name: SPRINTWEAVE_AGENTS_DIR
              value: /app/sprintweave-agents
            - name: SPRINTWEAVE_PROMPTS
              value: /app/sprintweave-web/prompts
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sprintweave-llm
                  key: LLM_API_KEY
          envFrom:
            - configMapRef:
                name: sprintweave-config
          volumeMounts:
            - name: data
              mountPath: /data
            - name: docling-cache
              mountPath: /opt/docling-cache
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: "4"
              # Docling model load OOMs at 1–2Gi; keep >=8Gi in cluster
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 8
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sprintweave-data
        - name: docling-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sprintweave-api
  namespace: sprintweave
spec:
  selector:
    app: sprintweave-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprintweave-ui
  namespace: sprintweave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sprintweave-ui
  template:
    metadata:
      labels:
        app: sprintweave-ui
    spec:
      containers:
        - name: ui
          image: quay.io/YOUR_ORG/sprintweave-rhoso:latest
          imagePullPolicy: Always
          workingDir: /app/sprintweave-web
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /app
            - name: SPRINTWEAVE_API_URL
              value: "http://sprintweave-api:8000"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sprintweave-ui
  namespace: sprintweave
spec:
  selector:
    app: sprintweave-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sprintweave-ui
  namespace: sprintweave
spec:
  to:
    kind: Service
    name: sprintweave-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
